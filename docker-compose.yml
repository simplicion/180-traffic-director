version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: traffic-director-backend
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - TD_PORT=4005
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: traffic-director-frontend
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - NEXT_PUBLIC_API_URL=http://localhost:4005
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: traffic-director-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
