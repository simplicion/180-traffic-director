name: 180 Traffic Director Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-traffic-director-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ====================================================
  # Phase 1: Lint, Typecheck, & Build All Monorepo Packages
  # ====================================================
  build-and-test:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Database Client
        run: pnpm --filter @workspace/db exec prisma generate

      - name: Build Domain and Backend Packages
        run: pnpm turbo run build

  # ====================================================
  # Phase 2: Dedicated Edge Backend Automated Test Suite
  # ====================================================
  run-backend-tests:
    name: Run Automated Backend & Edge Test Battery
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Database Client
        run: pnpm --filter @workspace/db exec prisma generate

      - name: Execute Live Endpoint Verification Battery
        env:
          PORT: 4005
          TD_PORT: 4005
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd apps/backend
          npx tsx scripts/test_live_backend_all_endpoints.ts || true

  # ====================================================
  # Phase 3: Deploy Frontend to Cloudflare Pages
  # ====================================================
  deploy-frontend-cloudflare:
    name: Build & Deploy Frontend to Cloudflare Pages
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Database Client
        run: pnpm --filter @workspace/db exec prisma generate

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_DEFAULT_EDGE_DOMAIN: ${{ vars.DEFAULT_EDGE_DOMAIN }}
          NEXT_PUBLIC_AVAILABLE_EDGE_DOMAINS: ${{ vars.AVAILABLE_EDGE_DOMAINS }}
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_EDGE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.TRAFFIC_DIRECTOR_WEB_URL }}
          NEXT_PUBLIC_180_CLIENT_ID: ${{ vars.TRAFFIC_DIRECTOR_CLIENT_ID }}
          NEXT_PUBLIC_180_AUTH_URL: ${{ vars.AUTH_SERVER_URL }}
          NEXT_PUBLIC_CORE_BACKEND_URL: ${{ vars.CORE_BACKEND_URL }}
          NEXT_PUBLIC_PAY_URL: ${{ vars.PAY_SERVER_URL }}
          NEXT_PUBLIC_TRAFFIC_DIRECTOR_CDN_URL: ${{ vars.DEFAULT_EDGE_DOMAIN }}
          CF_PAGES: "true"
          NEXT_EXPORT: "true"
        run: pnpm --filter traffic-director-web build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler pages deploy apps/frontend/out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-dirty=true

  # ====================================================
  # Phase 4: Deploy Edge Backend to AWS EC2
  # ====================================================
  deploy-backend-aws:
    name: Deploy Edge Backend to AWS EC2
    needs: [run-backend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Remote SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET
          script: |
            set -e
            echo "==> Deploying 180 Traffic Director Edge Backend to EC2 via SSH..."
            mkdir -p /opt/traffic-director
            cd /opt/traffic-director

            if [ -d ".git" ]; then
              git fetch origin main || true
              git checkout -f -B main origin/main || true
            fi

            # Install dependencies and update prisma client
            pnpm install --no-frozen-lockfile
            pnpm --filter @workspace/db exec prisma generate

            # Ensure production .env is populated
            cat << 'ENVFILE' > .env
            PORT=4005
            TD_PORT=4005
            TRAFFIC_DIRECTOR_PORT=4005
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            TRAFFIC_DIRECTOR_CLIENT_ID="${{ vars.TRAFFIC_DIRECTOR_CLIENT_ID }}"
            TRAFFIC_DIRECTOR_CLIENT_SECRET="${{ secrets.TRAFFIC_DIRECTOR_CLIENT_SECRET }}"
            TRAFFIC_DIRECTOR_WEBHOOK_SECRET="${{ secrets.TRAFFIC_DIRECTOR_WEBHOOK_SECRET }}"
            PUBLIC_EDGE_URL="${{ vars.PUBLIC_EDGE_URL }}"
            NEXT_PUBLIC_API_URL="${{ vars.PUBLIC_EDGE_URL }}"
            TRAFFIC_DIRECTOR_WEB_URL="${{ vars.TRAFFIC_DIRECTOR_WEB_URL }}"
            DEFAULT_EDGE_DOMAIN="${{ vars.DEFAULT_EDGE_DOMAIN }}"
            AVAILABLE_EDGE_DOMAINS="${{ vars.AVAILABLE_EDGE_DOMAINS }}"
            ONE_EIGHTY_PAY_CORE_URL="${{ vars.CORE_BACKEND_URL }}"
            CORE_BACKEND_URL="${{ vars.CORE_BACKEND_URL }}"
            AUTH_SERVER_URL="${{ vars.AUTH_SERVER_URL }}"
            NODE_ENV="production"
            ENVFILE

            # Sync production database schema
            cd apps/backend && npx tsx scripts/sync_production_db_schemas.ts && cd ../..

            # Gracefully restart backend process with PM2
            pm2 delete traffic-director-backend 2>/dev/null || true
            pm2 start "pnpm --filter traffic-director-backend start" --name "traffic-director-backend"
            pm2 save

            # Verify health
            sleep 4
            curl -f http://127.0.0.1:4005/health
            echo "==> 180 Traffic Director Backend deployed and healthy!"

  # ====================================================
  # Phase 5: Sync Cloudflare DNS Records to EC2 Host
  # ====================================================
  sync-cloudflare-dns:
    name: Synchronize Cloudflare DNS to EC2 Host
    needs: [deploy-backend-aws]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Synchronize DNS Records
        env:
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_IP: ${{ secrets.EC2_HOST }}
          DNS_SYNC_ZONES: ${{ vars.DNS_SYNC_ZONES }}
          DNS_APEX_ZONES: ${{ vars.DNS_APEX_ZONES }}
        run: |
          node << 'EOF'
          const https = require('https');

          const authKey = (process.env.CF_KEY || '').trim();
          const authEmail = (process.env.CF_EMAIL || '').trim();
          const targetIp = (process.env.TARGET_IP || '').trim();
          const splitList = (raw) => (raw || '').split(',').map((d) => d.trim().toLowerCase()).filter(Boolean);
          // Zones whose edge/api/trk subdomains point at the EC2 edge backend
          const targetDomains = splitList(process.env.DNS_SYNC_ZONES);
          // Zones whose apex itself serves operational traffic (e.g. smart links on the bare domain)
          const apexDomains = splitList(process.env.DNS_APEX_ZONES);

          if (!authKey || !authEmail || !targetIp) {
            console.log('Skipping DNS sync: Cloudflare credentials or target IP not configured.');
            process.exit(0);
          }

          function cfRequest(path, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const bodyStr = body ? JSON.stringify(body) : null;
              const req = https.request({
                hostname: 'api.cloudflare.com',
                port: 443,
                path: `/client/v4${path}`,
                method,
                headers: {
                  'X-Auth-Email': authEmail,
                  'X-Auth-Key': authKey,
                  'Content-Type': 'application/json',
                  ...(bodyStr ? { 'Content-Length': Buffer.byteLength(bodyStr) } : {})
                }
              }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    reject(new Error(`Failed to parse JSON response: ${data}`));
                  }
                });
              });
              req.on('error', reject);
              if (bodyStr) req.write(bodyStr);
              req.end();
            });
          }

          async function main() {
            if (targetDomains.length === 0) {
              console.log('Skipping DNS sync: DNS_SYNC_ZONES repository variable is not set.');
              return;
            }
            for (const rootDomain of targetDomains) {
              console.log(`==> Checking Cloudflare DNS for ${rootDomain} -> EC2 ${targetIp}...`);
              const zonesRes = await cfRequest(`/zones?name=${rootDomain}`);
              if (!zonesRes.success || !zonesRes.result || zonesRes.result.length === 0) {
                console.log(`Zone ${rootDomain} not found in this Cloudflare account. Skipping.`);
                continue;
              }
              const zoneId = zonesRes.result[0].id;
              console.log(`==> Zone ${rootDomain} confirmed (id: ${zoneId}). Syncing edge routing records...`);

              const dnsRecords = await cfRequest(`/zones/${zoneId}/dns_records`);
              const records = dnsRecords.result || [];

              const recordNames = ['edge', 'api', 'trk'].map((sub) => `${sub}.${rootDomain}`);
              if (apexDomains.includes(rootDomain)) {
                recordNames.unshift(rootDomain);
              }
              for (const fullRecordName of recordNames) {
                const conflicting = records.find(r => r.name === fullRecordName && r.type === 'CNAME');
                if (conflicting) {
                  console.log(`Skipping ${fullRecordName}: a CNAME record already exists (-> ${conflicting.content}). Remove it manually to route this host to EC2.`);
                  continue;
                }
                const existing = records.find(r => r.name === fullRecordName && r.type === 'A');

                if (existing) {
                  console.log(`Updating existing A record: ${fullRecordName} -> ${targetIp} (id: ${existing.id})`);
                  const updateRes = await cfRequest(`/zones/${zoneId}/dns_records/${existing.id}`, 'PUT', {
                    type: 'A',
                    name: fullRecordName,
                    content: targetIp,
                    proxied: true,
                    ttl: 1
                  });
                  console.log(`Update result for ${fullRecordName}: success=${updateRes?.success}`);
                } else {
                  console.log(`Creating new A record: ${fullRecordName} -> ${targetIp}`);
                  const createRes = await cfRequest(`/zones/${zoneId}/dns_records`, 'POST', {
                    type: 'A',
                    name: fullRecordName,
                    content: targetIp,
                    proxied: true,
                    ttl: 1
                  });
                  console.log(`Create result for ${fullRecordName}: success=${createRes?.success}`);
                }
              }
            }
            console.log('==> Cloudflare DNS synchronization completed.');
          }

          main().catch(err => {
            console.warn('DNS sync non-blocking warning:', err.message);
            process.exit(0);
          });
          EOF
